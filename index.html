<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturisticBD Newsroom · Daily Marketing Intelligence</title>
<meta name="description" content="Daily curated news for Bangladesh's marketing leaders. Industry, marketing, promotions & trends — powered by FuturisticBD.">
<meta property="og:title" content="FuturisticBD Newsroom">
<meta property="og:description" content="Daily marketing & industry intelligence for Bangladesh's business leaders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Apply theme before first paint to avoid flash */
(function(){
  var t = null;
  try { t = localStorage.getItem('fbd-theme'); } catch(e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  :root, [data-theme="light"]{
    --bg:#f7f7f5;
    --surface:#ffffff;
    --surface-2:#efefec;
    --border:#e3e3df;
    --border-strong:#cfcfc9;
    --text:#1b1b18;
    --text-2:#57564f;
    --text-3:#6e6d65;
    --accent:#0f766e;
    --accent-ink:#0b5952;
    --accent-soft:rgba(15,118,110,.08);
    --c-industry:#166534;   --c-industry-bg:rgba(22,101,52,.09);
    --c-marketing:#1e40af;  --c-marketing-bg:rgba(30,64,175,.08);
    --c-promotion:#92400e;  --c-promotion-bg:rgba(146,64,14,.09);
    --c-trend:#6b21a8;      --c-trend-bg:rgba(107,33,168,.08);
    --c-bd:#0f766e;         --c-bd-bg:rgba(15,118,110,.08);
    --c-global:#475569;     --c-global-bg:rgba(71,85,105,.09);
    --promo-edge:#b45309;
    --shadow:0 1px 2px rgba(24,24,20,.05);
    --shadow-lift:0 6px 20px rgba(24,24,20,.09);
  }
  [data-theme="dark"]{
    --bg:#121214;
    --surface:#1a1a1d;
    --surface-2:#222226;
    --border:#2b2b30;
    --border-strong:#3d3d44;
    --text:#ececea;
    --text-2:#a9a8a1;
    --text-3:#8b8a83;
    --accent:#2dd4bf;
    --accent-ink:#5eead4;
    --accent-soft:rgba(45,212,191,.10);
    --c-industry:#6ee7a0;   --c-industry-bg:rgba(74,222,128,.10);
    --c-marketing:#93b4fd;  --c-marketing-bg:rgba(96,165,250,.10);
    --c-promotion:#fbbf24;  --c-promotion-bg:rgba(251,191,36,.10);
    --c-trend:#c4b5fd;      --c-trend-bg:rgba(167,139,250,.10);
    --c-bd:#5eead4;         --c-bd-bg:rgba(45,212,191,.09);
    --c-global:#a8b3c4;     --c-global-bg:rgba(148,163,184,.10);
    --promo-edge:#d97706;
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --shadow-lift:0 8px 24px rgba(0,0,0,.35);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body,header,footer,.card,.pill,.dtab,.stat,.search-wrap input,#theme-toggle,#btt,.congrats,.tag{
    transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  a{color:var(--accent-ink)}
  button{font-family:inherit}

  /* ---------- header ---------- */
  header{
    background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
  }
  .header-inner{
    max-width:1200px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .brand h1 .accent{color:var(--accent)}
  .brand p{font-size:12px;color:var(--text-3);margin-top:2px}
  .header-meta{display:flex;align-items:center;gap:14px}
  #last-updated{font-size:12px;color:var(--text-3);text-align:right}
  #theme-toggle{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #theme-toggle:hover{border-color:var(--border-strong);color:var(--text)}
  #theme-toggle svg{width:17px;height:17px}
  [data-theme="light"] .icon-sun{display:none}
  [data-theme="dark"] .icon-moon{display:none}

  main{max-width:1200px;margin:0 auto;padding:28px 24px 56px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:14px 18px;box-shadow:var(--shadow);
  }
  .stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat-lbl{font-size:12px;color:var(--text-3);margin-top:2px}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
  .search-wrap{position:relative;max-width:520px}
  .search-wrap svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-3);pointer-events:none;
  }
  .search-wrap input{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:10px 14px 10px 38px;color:var(--text);font-size:14px;font-family:inherit;outline:none;
  }
  .search-wrap input::placeholder{color:var(--text-3)}
  .search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .filter-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .filter-label{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-3);flex-shrink:0;min-width:64px;
  }
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{
    padding:6px 13px;border-radius:100px;font-size:13px;font-weight:500;
    border:1px solid var(--border);background:var(--surface);color:var(--text-2);
    cursor:pointer;line-height:1.2;
  }
  .pill:hover{border-color:var(--border-strong);color:var(--text)}
  .pill.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}

  /* ---------- date tabs ---------- */
  .date-bar{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
    scrollbar-width:thin;
  }
  .dtab{
    padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;
    border:1px solid var(--border);background:var(--surface);color:var(--text-2);
    cursor:pointer;display:flex;align-items:center;gap:7px;flex-shrink:0;
  }
  .dtab:hover{border-color:var(--border-strong);color:var(--text)}
  .dtab.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
  .dtab .cnt{
    font-size:11px;font-weight:600;color:var(--text-3);
    background:var(--surface-2);border-radius:100px;padding:1px 7px;font-variant-numeric:tabular-nums;
  }
  .dtab.on .cnt{background:transparent;color:var(--accent-ink)}

  .result-bar{margin-bottom:16px;font-size:13px;color:var(--text-3)}
  .result-bar strong{color:var(--text-2);font-weight:600}

  /* ---------- grid & cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1020px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    main{padding:20px 16px 48px}
    .header-inner{padding:14px 16px}
    #last-updated{display:none}
  }
  @media(min-width:641px) and (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}

  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:18px;display:flex;flex-direction:column;gap:10px;
    box-shadow:var(--shadow);
    animation:cardIn .4s cubic-bezier(.22,.7,.35,1) both;
    animation-delay:calc(var(--i,0)*35ms);
    transition:background-color .25s ease,color .25s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong)}
  .card.promo{border-left:3px solid var(--promo-edge);padding-left:16px}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;line-height:1.7;
  }
  .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
  .b-industry{color:var(--c-industry);background:var(--c-industry-bg)}
  .b-marketing{color:var(--c-marketing);background:var(--c-marketing-bg)}
  .b-promotion{color:var(--c-promotion);background:var(--c-promotion-bg)}
  .b-trend{color:var(--c-trend);background:var(--c-trend-bg)}
  .b-bd{color:var(--c-bd);background:var(--c-bd-bg)}
  .b-global{color:var(--c-global);background:var(--c-global-bg)}
  .card-date{font-size:12px;color:var(--text-3);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
  .card-headline{font-size:15.5px;font-weight:600;line-height:1.42;letter-spacing:-.01em}
  .card-headline .promo-ico{
    display:inline-block;width:14px;height:14px;vertical-align:-1.5px;margin-right:5px;color:var(--promo-edge);
  }
  .card-summary{
    font-size:13.5px;color:var(--text-2);line-height:1.6;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .congrats{
    background:var(--accent-soft);border-left:2px solid var(--promo-edge);
    border-radius:0 7px 7px 0;padding:9px 12px;font-size:12.5px;color:var(--text-2);line-height:1.55;
  }
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{
    font-size:11px;color:var(--text-3);background:var(--surface-2);
    border-radius:5px;padding:2px 8px;line-height:1.7;
  }
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;padding-top:10px;border-top:1px solid var(--border)}
  .src-link{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;
    color:var(--text-2);text-decoration:none;
    border-bottom:1px solid transparent;transition:color .15s ease,border-color .15s ease;
  }
  .src-link:hover{color:var(--accent-ink);border-bottom-color:var(--accent-ink)}
  .src-link svg{width:12px;height:12px;flex-shrink:0}

  /* ---------- states ---------- */
  .state-box{grid-column:1/-1;text-align:center;padding:72px 20px;animation:cardIn .4s ease both}
  .state-box h3{font-size:16px;font-weight:600;margin-bottom:6px}
  .state-box p{font-size:13.5px;color:var(--text-3)}
  .loading-bar{
    grid-column:1/-1;height:2px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:64px auto;max-width:220px;width:100%;
  }
  .loading-bar span{
    display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;
    animation:slideBar 1.1s ease-in-out infinite;
  }
  @keyframes slideBar{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}

  /* ---------- back to top ---------- */
  #btt{
    position:fixed;bottom:24px;right:24px;width:42px;height:42px;border-radius:10px;
    background:var(--surface);color:var(--text-2);border:1px solid var(--border);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-lift);z-index:999;
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .25s ease,transform .25s ease,background-color .25s ease,border-color .25s ease,color .25s ease;
  }
  #btt.show{opacity:1;transform:none;pointer-events:auto}
  #btt:hover{color:var(--text);border-color:var(--border-strong)}
  #btt svg{width:16px;height:16px}

  /* ---------- footer ---------- */
  footer{background:var(--surface);border-top:1px solid var(--border);padding:30px 24px;margin-top:24px}
  .footer-inner{max-width:1200px;margin:0 auto;text-align:center}
  footer .brand-line{font-size:14px;font-weight:600;margin-bottom:6px}
  footer .brand-line .accent{color:var(--accent)}
  footer p{font-size:12.5px;color:var(--text-3);line-height:2}
  footer a{color:var(--accent-ink);text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .sep{margin:0 8px;color:var(--border-strong)}

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .card:hover,#btt{transform:none}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>FuturisticBD <span class="accent">Newsroom</span></h1>
      <p>Daily marketing &amp; industry intelligence — Bangladesh &amp; global</p>
    </div>
    <div class="header-meta">
      <div id="last-updated"></div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Newsroom statistics"></section>

  <section class="controls" aria-label="Filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search headlines, summaries, sources, tags, people&hellip;" autocomplete="off" aria-label="Search stories">
    </div>
    <div class="filter-row">
      <span class="filter-label">Region</span>
      <div class="pills" id="region-pills" role="group" aria-label="Filter by region">
        <button class="pill on" data-val="all" type="button">All</button>
        <button class="pill" data-val="bangladesh" type="button">Bangladesh</button>
        <button class="pill" data-val="global" type="button">Global</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Category</span>
      <div class="pills" id="cat-pills" role="group" aria-label="Filter by category">
        <button class="pill on" data-val="all" type="button">All</button>
        <button class="pill" data-val="industry" type="button">Industry</button>
        <button class="pill" data-val="marketing" type="button">Marketing</button>
        <button class="pill" data-val="promotion" type="button">Promotion</button>
        <button class="pill" data-val="trend" type="button">Trend</button>
      </div>
    </div>
  </section>

  <nav class="date-bar" id="date-bar" aria-label="Archive dates"></nav>

  <div class="result-bar" id="result-bar"></div>

  <section class="grid" id="grid" aria-live="polite">
    <div class="loading-bar" aria-label="Loading"><span></span></div>
  </section>
</main>

<button id="btt" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<footer>
  <div class="footer-inner">
    <div class="brand-line">FuturisticBD <span class="accent">Newsroom</span></div>
    <p>
      Curated daily for Bangladesh's marketing leaders — refreshed every day at 10:00 AM (BST).
      <br>
      Contact: <a href="mailto:contact.futuristicbd@gmail.com">contact.futuristicbd@gmail.com</a>
      <span class="sep">&middot;</span>
      &copy; <span id="year"></span> FuturisticBD. All rights reserved.
    </p>
  </div>
</footer>

<script>
(function(){
  'use strict';

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(iso, withYear){
    var p = String(iso || '').split('-');
    if (p.length !== 3) return esc(iso);
    var m = MONTHS[(+p[1]) - 1] || p[1];
    return m + ' ' + (+p[2]) + (withYear ? ', ' + p[0] : '');
  }
  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
    };
  }
  function $(id){ return document.getElementById(id); }

  /* ---------------- theme ---------------- */
  function storedTheme(){
    try { var v = localStorage.getItem('fbd-theme'); return (v === 'light' || v === 'dark') ? v : null; } catch(e){ return null; }
  }
  function saveTheme(v){
    try { localStorage.setItem('fbd-theme', v); } catch(e){}
  }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = $('theme-toggle');
    if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  $('theme-toggle').addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    saveTheme(next);
  });
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(e){ if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light'); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  /* ---------------- state ---------------- */
  var allNews = [];
  var meta = null;
  var state = { q: '', region: 'all', cat: 'all', date: null };
  var loadedOnce = false;

  /* ---------------- data ---------------- */
  function loadData(){
    fetch('news-data.json?_=' + Date.now())
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){
        allNews = Array.isArray(d.news) ? d.news : [];
        meta = d.meta || {};
        var dates = distinctDates();
        if (!state.date || (state.date !== 'all' && dates.indexOf(state.date) === -1)){
          state.date = dates.length ? dates[0] : 'all';
        }
        loadedOnce = true;
        renderLastUpdated();
        renderStats();
        renderDateTabs();
        renderCards();
      })
      .catch(function(){
        if (loadedOnce) return; /* keep showing existing data on background refresh failure */
        $('stats').innerHTML = '';
        $('date-bar').innerHTML = '';
        $('result-bar').textContent = '';
        $('grid').innerHTML =
          '<div class="state-box">' +
            '<h3>Unable to load the newsroom feed</h3>' +
            '<p>The news data could not be fetched right now. Please check your connection and try again shortly.</p>' +
          '</div>';
      });
  }

  function distinctDates(){
    var seen = {}, out = [];
    for (var i = 0; i < allNews.length; i++){
      var dt = allNews[i].date;
      if (dt && !seen[dt]){ seen[dt] = true; out.push(dt); }
    }
    out.sort(function(a, b){ return a < b ? 1 : a > b ? -1 : 0; });
    return out;
  }

  function matchesSearch(n, q){
    if (!q) return true;
    var hay = [
      n.headline, n.summary, n.source, n.promotionPerson,
      Array.isArray(n.tags) ? n.tags.join(' ') : ''
    ].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function filteredList(){
    var q = state.q.trim().toLowerCase();
    var list = [];
    for (var i = 0; i < allNews.length; i++){
      var n = allNews[i];
      if (state.date !== 'all' && n.date !== state.date) continue;
      if (state.region !== 'all' && n.region !== state.region) continue;
      if (state.cat !== 'all' && n.category !== state.cat) continue;
      if (!matchesSearch(n, q)) continue;
      list.push({ n: n, i: i });
    }
    /* promotions float to the top; otherwise keep feed order (newest first within data) */
    list.sort(function(a, b){
      var pa = a.n.isPromotion ? 1 : 0, pb = b.n.isPromotion ? 1 : 0;
      if (pa !== pb) return pb - pa;
      return a.i - b.i;
    });
    return list.map(function(x){ return x.n; });
  }

  /* ---------------- rendering ---------------- */
  function renderLastUpdated(){
    var el = $('last-updated');
    if (!meta || !meta.lastUpdated){ el.textContent = ''; return; }
    var d = new Date(meta.lastUpdated);
    if (isNaN(d)){ el.textContent = ''; return; }
    el.textContent = 'Updated ' + d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }

  function renderStats(){
    var dates = distinctDates();
    var latest = dates[0];
    var today = 0, bd = 0, gl = 0, promos = 0;
    for (var i = 0; i < allNews.length; i++){
      var n = allNews[i];
      if (n.date === latest) today++;
      if (n.region === 'bangladesh') bd++;
      else if (n.region === 'global') gl++;
      if (n.isPromotion) promos++;
    }
    var items = [
      { v: today, l: "Today's stories" },
      { v: bd, l: 'Bangladesh' },
      { v: gl, l: 'Global' },
      { v: promos, l: 'Promotions' },
      { v: dates.length, l: 'Archive days' }
    ];
    $('stats').innerHTML = items.map(function(s){
      return '<div class="stat"><div class="stat-val">' + s.v + '</div><div class="stat-lbl">' + esc(s.l) + '</div></div>';
    }).join('');
  }

  function renderDateTabs(){
    var dates = distinctDates();
    var counts = {};
    for (var i = 0; i < allNews.length; i++){
      counts[allNews[i].date] = (counts[allNews[i].date] || 0) + 1;
    }
    var html = '<button class="dtab' + (state.date === 'all' ? ' on' : '') + '" data-date="all" type="button">All days <span class="cnt">' + allNews.length + '</span></button>';
    html += dates.map(function(dt, idx){
      var label = idx === 0 ? 'Latest · ' + fmtDate(dt) : fmtDate(dt);
      return '<button class="dtab' + (state.date === dt ? ' on' : '') + '" data-date="' + esc(dt) + '" type="button">' +
        esc(label) + ' <span class="cnt">' + (counts[dt] || 0) + '</span></button>';
    }).join('');
    var bar = $('date-bar');
    bar.innerHTML = html;
    var tabs = bar.querySelectorAll('.dtab');
    for (var t = 0; t < tabs.length; t++){
      tabs[t].addEventListener('click', function(){
        state.date = this.getAttribute('data-date');
        var all = bar.querySelectorAll('.dtab');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('on');
        this.classList.add('on');
        renderCards();
      });
    }
  }

  var EXT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
  var PROMO_ICON = '<svg class="promo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/></svg>';

  function cardHTML(n, idx){
    var promo = !!n.isPromotion;
    var badges =
      '<span class="badge ' + (n.region === 'bangladesh' ? 'b-bd' : 'b-global') + '">' +
        (n.region === 'bangladesh' ? 'Bangladesh' : 'Global') + '</span>' +
      '<span class="badge b-' + esc(n.category) + '">' +
        esc(String(n.category || '').charAt(0).toUpperCase() + String(n.category || '').slice(1)) + '</span>';
    var tags = '';
    if (Array.isArray(n.tags) && n.tags.length){
      tags = '<div class="tags">' + n.tags.map(function(t){
        return '<span class="tag">' + esc(t) + '</span>';
      }).join('') + '</div>';
    }
    var congrats = '';
    if (promo && n.congratsMessage){
      congrats = '<div class="congrats">' + esc(n.congratsMessage) + '</div>';
    }
    var src = '';
    if (n.sourceUrl){
      src = '<a class="src-link" href="' + esc(n.sourceUrl) + '" target="_blank" rel="noopener noreferrer">' +
        esc(n.source || 'Source') + ' ' + EXT_ICON + '</a>';
    } else {
      src = '<span class="src-link">' + esc(n.source || '') + '</span>';
    }
    return '<article class="card' + (promo ? ' promo' : '') + '" style="--i:' + Math.min(idx, 11) + '">' +
      '<div class="card-top"><div class="badges">' + badges + '</div>' +
        '<span class="card-date">' + fmtDate(n.date, true) + '</span></div>' +
      '<h2 class="card-headline">' + (promo ? PROMO_ICON : '') + esc(n.headline) + '</h2>' +
      '<p class="card-summary">' + esc(n.summary) + '</p>' +
      congrats +
      tags +
      '<div class="card-foot">' + src + '</div>' +
    '</article>';
  }

  function renderCards(){
    var list = filteredList();
    var grid = $('grid');
    var bar = $('result-bar');
    var scope = state.date === 'all' ? 'across all days' : 'on ' + fmtDate(state.date, true);
    bar.innerHTML = 'Showing <strong>' + list.length + '</strong> ' +
      (list.length === 1 ? 'story' : 'stories') + ' ' + esc(scope) +
      (state.q.trim() ? ' matching &ldquo;<strong>' + esc(state.q.trim()) + '</strong>&rdquo;' : '');
    if (!list.length){
      grid.innerHTML =
        '<div class="state-box">' +
          '<h3>No stories match</h3>' +
          '<p>Try clearing the search, switching filters, or choosing another date.</p>' +
        '</div>';
      return;
    }
    grid.innerHTML = list.map(cardHTML).join('');
  }

  /* ---------------- controls ---------------- */
  function bindPills(containerId, key){
    var box = $(containerId);
    box.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.pill') : null;
      if (!btn) return;
      state[key] = btn.getAttribute('data-val');
      var all = box.querySelectorAll('.pill');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
      btn.classList.add('on');
      renderCards();
    });
  }
  bindPills('region-pills', 'region');
  bindPills('cat-pills', 'cat');

  $('search').addEventListener('input', debounce(function(){
    state.q = this.value || '';
    renderCards();
  }, 250));

  /* ---------------- back to top ---------------- */
  var btt = $('btt');
  window.addEventListener('scroll', function(){
    btt.classList.toggle('show', window.scrollY > 480);
  }, { passive: true });
  btt.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------------- boot ---------------- */
  $('year').textContent = new Date().getFullYear();
  loadData();
  setInterval(loadData, 30 * 60 * 1000);
})();
</script>
</body>
</html>
