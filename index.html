<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturisticBD Newsroom · Daily Marketing Intelligence</title>
<meta name="description" content="Daily curated news for Bangladesh's marketing leaders. Industry, marketing, promotions & trends — powered by FuturisticBD.">
<meta property="og:title" content="FuturisticBD Newsroom">
<meta property="og:description" content="Daily marketing & industry intelligence for Bangladesh's business leaders.">
<meta name="theme-color" content="#f7f7f5">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
/* Apply theme before first paint to avoid flash */
(function(){
  var t = null;
  try { t = localStorage.getItem('fbd-theme'); } catch(e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
