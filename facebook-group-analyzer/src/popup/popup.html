<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Group Insight</title>
  </head>
  <body>
    <header class="hd">
      <div class="logo">GI</div>
      <div>
        <h1>Group Insight</h1>
        <p class="sub">Facebook group analyzer</p>
      </div>
    </header>

    <!-- Shown when not on a group page -->
    <section id="notOnGroup" class="panel hidden">
      <p class="notice">
        Open a Facebook <b>group</b> you belong to, then reopen this popup.
      </p>
      <p class="hint">The address should look like<br /><code>facebook.com/groups/&lt;name&gt;</code></p>
    </section>

    <!-- Main controls -->
    <section id="controls" class="panel hidden">
      <div class="group-badge" id="groupBadge">—</div>

      <div class="live" id="live">
        <div class="live-stat"><b id="pPosts">0</b><span>posts</span></div>
        <div class="live-stat"><b id="pComments">0</b><span>comments</span></div>
        <div class="live-stat"><b id="pScrolls">0</b><span>scrolls</span></div>
      </div>
      <div class="status" id="status">Idle</div>

      <div class="row btns">
        <button id="startBtn" class="btn primary">▶ Start scraping</button>
        <button id="stopBtn" class="btn danger hidden">■ Stop</button>
      </div>

      <details class="filters" id="filters">
        <summary>Filters &amp; options</summary>

        <label class="fld">
          <span>Max posts</span>
          <input type="number" id="maxPosts" min="10" max="5000" step="10" value="300" />
        </label>

        <div class="row2">
          <label class="fld">
            <span>From date</span>
            <input type="date" id="dateFrom" />
          </label>
          <label class="fld">
            <span>To date</span>
            <input type="date" id="dateTo" />
          </label>
        </div>

        <label class="fld">
          <span>Keyword contains</span>
          <input type="text" id="keyword" placeholder="e.g. hiring, laptop" />
        </label>

        <label class="fld">
          <span>Min engagement</span>
          <input type="number" id="minEngagement" min="0" step="1" value="0" />
        </label>

        <label class="fld">
          <span>Scroll delay: <b id="delayVal">1.4</b>s</span>
          <input type="range" id="scrollDelay" min="600" max="4000" step="100" value="1400" />
        </label>

        <label class="chk">
          <input type="checkbox" id="scrapeComments" checked /> Scrape visible comments
        </label>
        <label class="chk">
          <input type="checkbox" id="expandSeeMore" checked /> Auto-expand “See more”
        </label>
      </details>

      <button id="dashBtn" class="btn ghost full">📊 Open dashboard</button>
    </section>

    <footer class="ft">
      <span id="dbInfo">—</span>
      <a href="#" id="clearGroup" class="danger-link">Clear this group</a>
    </footer>

    <script src="../lib/db.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
